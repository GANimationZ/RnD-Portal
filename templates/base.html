<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='vendor/boxicons/basic/boxicons.min.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='vendor/boxicons/filled/boxicons-filled.min.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='vendor/boxicons/brands/boxicons-brands.min.css') }}"
    />
    <link
      href="https://googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/base.css') }}"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    {% block head %}{% endblock %}
    {% block title %}
    {% endblock %}
    {% block styles %}
    {% endblock %}
  </head>

  <body>
    {% block body %}{% endblock %}
    {% block script %}
    {% endblock %}
  </body>
</html>
