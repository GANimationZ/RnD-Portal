<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='vendor/boxicons/basic/boxicons.min.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='vendor/boxicons/filled/boxicons-filled.min.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='vendor/boxicons/brands/boxicons-brands.min.css') }}"
    />
    <link
      href="https://googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/base.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='vendor/flatpickr/flatpickr.min.css') }}"
    />
    <script src="{{ url_for('static', filename='vendor/flatpickr/flatpickr.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/chartjs/chart.umd.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/chartjs/chartjs-plugin-datalabels.min.js') }}"></script>
    {% block head %}{% endblock %}
    {% block title %}
    {% endblock %}
    {% block styles %}
    {% endblock %}
  </head>

  <body>
    {% block body %}{% endblock %}
    {% block script %}
      <script>
        window.ACTIVE_NAV = "{{ active_nav }}";
      </script>
      <script src="{{ url_for('static', filename='javascript/sidebar/script.js') }}"></script>
      <script src="{{ url_for('static', filename='javascript/workspace/panel-switcher.js') }}"></script>
    {% endblock %}
  </body>
</html>
