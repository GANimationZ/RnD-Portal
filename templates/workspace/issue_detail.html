<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Issue #{{ issue.id }} - {{ issue.title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4 bg-light">
    <div class="container bg-white p-4 rounded shadow-sm" style="max-width: 700px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Issue #{{ issue.id }}: {{ issue.title }}</h2>
            <span class="badge bg-warning text-dark">{{ issue.status }}</span>
        </div>
        
        <p><strong>Status Prioritas:</strong> <span class="badge bg-danger">{{ issue.priority }}</span></p>
        <p><strong>Tanggal Dibuat:</strong> {{ issue.created_at }}</p>

        <hr>

        <h5>Deskripsi:</h5>
        <p>{{ issue.description }}</p>

        <hr>

        <h5>Lampiran Gambar:</h5>
        {% if issue.image_filename %}
            <div class="mt-3 text-center">
                <!-- Memanggil gambar dari static/assets/upload/ -->
                <img src="{{ url_for('static', filename='assets/upload/' + issue.image_filename) }}" 
                      alt="Lampiran Issue {{ issue.id }}" 
                      class="img-fluid rounded shadow-sm">
            </div>
        {% else %}
            <p class="text-muted">Tidak ada lampiran gambar.</p>
        {% endif %}

        <div class="mt-4">
            <a href="/workspace/kpi-dashboard" class="btn btn-secondary">Kembali ke Dashboard</a>
        </div>
    </div>
</body>
</html>
